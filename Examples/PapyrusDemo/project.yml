name: PapyrusDemo
options:
  bundleIdPrefix: com.papyrus.demo
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Papyrus:
    path: ../..
targets:
  PapyrusDemo:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
    sources:
      - path: PapyrusDemo
    dependencies:
      - package: Papyrus
        product: Papyrus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papyrus.demo.PapyrusDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ENABLE_PREVIEWS: true
